name: capture-PPC-2T26
# Captura dedicada e agendada do call da Pilgrim's Pride (PPC US) 2T26.
# Call: 2026-07-30 13:00Z (10:00 BRT / 09:00 EDT). WEBCAST ChorusCall (listen-only, EN) — NAO e Zoom.
# Dispara por cron (varios ticks redundantes na janela do gate) e valida a janela com gate.py;
# spec FIXO em jobs/PPC_2T26.json (nao depende de deteccao de arquivo nem de sessao do Claude).
# Removivel apos 30/07/2026.
on:
  schedule:
    - cron: '0 11 30 7 *'    # 2026-07-30 11:00Z = 08:00 BRT (T-2h)
    - cron: '30 11 30 7 *'   # 2026-07-30 11:30Z = 08:30 BRT (T-1h30)
    - cron: '0 12 30 7 *'    # 2026-07-30 12:00Z = 09:00 BRT (T-1h)
    - cron: '30 12 30 7 *'   # 2026-07-30 12:30Z = 09:30 BRT (T-0h30, ultima rede)
  workflow_dispatch: {}

concurrency:
  group: capture-ppc-2t26    # ticks/dispatch nao rodam em paralelo; o 1o que passar no gate vence
  cancel-in-progress: false

permissions:
  contents: write

env:
  SPEC: jobs/PPC_2T26.json

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # < 6h (teto do GitHub)
    steps:
      - uses: actions/checkout@v4

      - name: Validar janela de tempo (call nas proximas ~5h30)
        id: gate
        run: python3 scripts/gate.py "$SPEC"

      - name: Instalar dependencias
        if: steps.gate.outputs.run == 'yes'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg pulseaudio xvfb
          pip install -q faster-whisper playwright requests
          playwright install --with-deps chromium
          python3 scripts/get_model.py

      - name: Esperar ate T-10min, entrar no webcast e gravar
        if: steps.gate.outputs.run == 'yes'
        env:
          REG_NAME: ${{ secrets.REG_NAME }}
          REG_EMAIL: ${{ secrets.REG_EMAIL }}
          REG_COMPANY: ${{ secrets.REG_COMPANY }}
          REG_PHONE: ${{ secrets.REG_PHONE }}
          REG_TITLE_CATEGORY: Buy side
        run: |
          mkdir -p work
          nohup xvfb-run -a python3 scripts/capture.py "$SPEC" > work/capture.log 2>&1 &
          echo "captura em background (pid $!)"

      - name: Transcricao ao vivo + publicacao incremental no Notion
        if: steps.gate.outputs.run == 'yes'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          nohup python3 scripts/live_loop.py "$SPEC" > work/live.log 2>&1 &
          echo "live_loop em background (pid $!)"

      - name: Aguardar fim da gravacao
        if: steps.gate.outputs.run == 'yes'
        run: python3 scripts/wait_end.py

      - name: Transcricao final + publicacao no Notion
        if: steps.gate.outputs.run == 'yes'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/finalize.py "$SPEC"

      - name: Commit da transcricao no repo
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "earnings-bot"; git config user.email "bot@users.noreply.github.com"
          git add transcripts/ && git commit -m "transcript: PPC_2T26" && git pull -q --rebase && git push || echo "nada a commitar"

      - name: Upload do audio (artifact, 90 dias)
        if: always() && steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: audio-ppc-${{ github.run_id }}
          path: work/audio/
          retention-days: 90
