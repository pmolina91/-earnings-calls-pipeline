name: transcribe-replay
on:
  push:
    paths: ['replays/*.json']
  workflow_dispatch:
    inputs:
      spec:
        description: 'replays/XXXX.json'
        required: true
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: spec
        run: |
          F="${{ github.event.inputs.spec }}"
          if [ -z "$F" ]; then F=$(git diff --name-only HEAD~1 HEAD -- 'replays/*.json' | head -1); fi
          echo "f=$F" >> $GITHUB_OUTPUT
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper requests
          python3 scripts/get_model.py
      - name: transcrever (por interlocutor)
        run: python3 scripts/check_official_replay.py "${{ steps.spec.outputs.f }}"
      - name: commit
        if: always()
        run: |
          git config user.name earnings-bot
          git config user.email bot@users.noreply.github.com
          git add transcripts/ && git commit -m "transcript replay ${{ steps.spec.outputs.f }}" && git pull -q --rebase && git push || echo nada
